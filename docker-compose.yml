version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  streamlit:
    build: .
    container_name: streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - NEO4J_URI=neo4j://host.docker.internal:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=Manuvamshi@12
      - CLEAN_CSV=/app/data/movies_cleaned.csv
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped
volumes:
  qdrant_data:
